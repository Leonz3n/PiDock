<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>PiDock Task Page (S2)</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background: #f7f9fc;
        color: #1f2937;
        font: 14px/1.55 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main { padding: 28px 32px; }
      .eyebrow { color: #64748b; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
      h1 { margin: 6px 0 10px; font-size: 22px; }
      .panel { margin-top: 24px; padding: 18px; border: 1px solid #dbe3ee; border-radius: 12px; background: #fff; }
      code { padding: 2px 6px; border-radius: 5px; background: #eef2f7; }
    </style>
  </head>
  <body data-trust-domain="task">
    <main>
      <div class="eyebrow">PiDock task trust domain</div>
      <h1>任务页面</h1>
      <p>此页面不加载 shell preload，不拥有 <code>window.pidock</code>、Node 或任意 IPC 能力。</p>
      <section class="panel" id="task-surface" aria-label="任务页面内容">
        S2 controlled task page fixture
      </section>
    </main>
  </body>
</html>
